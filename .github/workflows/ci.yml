name: lexer-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run lexer tests
        run: make test
      - name: Build native x86-64 lexer library
        run: cc -std=gnu11 -O2 -Wall -Wextra -Werror -fPIC -shared arino_lexer.c fnv1a_x86_64.S -lm -o arino_lexer_x86_64.so
      - name: Publish binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: arino-lexer-linux-x86_64
          path: arino_lexer_x86_64.so
          if-no-files-found: error
