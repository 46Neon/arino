name: lexer-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify native x86-64 ELF files
        run: |
          file libarino_lexer.so
          file arino_lexer_tests
          file libarino_lexer.so | grep -F 'ELF 64-bit LSB shared object, x86-64'
          file arino_lexer_tests | grep -F 'ELF 64-bit LSB pie executable, x86-64'
      - name: Run compiled lexer tests against the shared library
        run: ./arino_lexer_tests
      - name: Publish native binaries
        uses: actions/upload-artifact@v4
        with:
          name: arino-lexer-linux-x86_64
          path: |
            libarino_lexer.so
            arino_lexer_tests
          if-no-files-found: error
